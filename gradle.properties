# 8GB machines: D8 merges Compose in this JVM. 3g is enough; 4g gets the process killed.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
android.nonTransitiveRClass=true
kotlin.native.ignoreDisabledTargets=true
